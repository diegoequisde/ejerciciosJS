<!-- Realiza un programa con dos botones “Comenzar Saludos” y “Parar Saludos”.
Al hacer click en “Comenzar Saludos”, lance un setInterval que cada 5
segundos muestra un “alert” con “Hola”. El botón “Parar Saludos” parará esa
secuencia.-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>
<body>
    <button id ="comenzar">Comenzar Saludos</button>
    <button id="parar">Parar Saludos</button>

<script>
    document.getElementById("comenzar").addEventListener("click", function(event){
        var interval = setInterval(function(){
            alert("Hola");
        }, 5000);
        document.getElementById("parar").addEventListener("click", function(event){
            clearInterval(interval);
        })
    })
</script>
</body>
</html>
